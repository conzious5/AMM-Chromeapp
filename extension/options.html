<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMM Voice Settings</title><link rel="stylesheet" href="options.css"></head>
  <body>
    <main>
      <header><p class="eyebrow">Authentic Moments</p><h1>AMM Voice settings</h1><p>Configure your writing assistant. Sender permissions always come from the backend and cannot be changed here.</p></header>
      <section aria-labelledby="experience-title"><h2 id="experience-title">Compose experience</h2>
        <label>Default action<select id="default-action"><option value="amm_style">AMM Style</option><option value="zacs_edit">Zac's Edit</option></select></label>
        <label class="check"><input id="show-review" type="checkbox"> Show meaningful Zac Review notes</label>
        <label class="check"><input id="auto-sender" type="checkbox"> Automatically use Gmail's From address when it is authorized</label>
      </section>
      <section aria-labelledby="connection-title"><h2 id="connection-title">Connection</h2>
        <label>Backend environment<select id="environment"><option value="production">Production</option><option value="local">Local development</option></select></label>
        <label>Backend URL<input id="backend" type="url" spellcheck="false"></label>
        <label>Email<input id="email" type="email" autocomplete="username"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password"></label>
        <label class="check development-only"><input id="development-mode" type="checkbox"> Use local mock authentication and sender identities</label>
        <p class="helper development-only">Mock authentication is permitted only for localhost and never stores a real secret.</p>
      </section>
      <div class="actions"><button id="save">Save settings</button><button id="signin">Sign in</button><button id="signout" class="secondary">Sign out</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
